name: Release

# Pushing a tag vX.Y.Z (scripts/release.mjs does it) runs the full CI matrix, then publishes the
# .vsix that CI built to the VS Code Marketplace (when a credential is set up) and creates a GitHub
# release with it attached. Setup (once): docs/RELEASE.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main and matches package.json and CHANGELOG
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME isn't on main"; exit 1; }
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but package.json is $version"; exit 1; }
          grep -qE "^## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no dated section for $version"; exit 1; }

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Its secrets and sign-in trust belong to this environment, which only release tags may use
    # and which can require approval before anything is published (docs/RELEASE.md).
    environment: marketplace
    permissions:
      contents: write # the GitHub release
      id-token: write # Microsoft Entra sign-in, when used instead of a token
    env:
      HAS_PAT: ${{ secrets.VSCE_PAT != '' }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The package CI built and tested in this run (its check job), not a rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidestory-vsix
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Sign in with Microsoft Entra ID
        if: env.HAS_PAT != 'true' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ "$HAS_PAT" = true ]; then auth=(); elif [ -n "$AZURE_CLIENT_ID" ]; then auth=(--azure-credential);
          else
            # Manual publishing: upload the .vsix from the GitHub release on the publisher page.
            echo "::warning::No Marketplace credential (docs/RELEASE.md), so not published; upload sidestory.vsix from the GitHub release at https://marketplace.visualstudio.com/manage/publishers/paperkite"
            exit 0
          fi
          # --skip-duplicate: a rerun after a later step failed doesn't fail here.
          npx --yes @vscode/vsce@4.0.0 publish --packagePath dist/sidestory.vsix --skip-duplicate "${auth[@]}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # This version's CHANGELOG section, without its heading.
          awk -v h="## $version " 'index($0, h) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/sidestory.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/sidestory.vsix --title "Sidestory $version" --notes-file notes.md --verify-tag
          fi
