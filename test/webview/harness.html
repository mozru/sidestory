<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The same policy as the real panel (src/extension/panel.ts), with 'self' for the webview resource origin. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' blob:; script-src 'nonce-harness'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
<title>Explainer webview harness</title>
<link rel="stylesheet" href="/dist/webview/codicons/codicon.css">
<link rel="stylesheet" href="/dist/webview/main.css">
<script nonce="harness">
  // Stands in for the VS Code webview host: records posted messages and keeps state in memory.
  window.__posted = [];
  window.__state = undefined;
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => {
      window.__posted.push(m);
      // Play the extension's part for assets: read the file and reply with its bytes.
      if (m.type === 'requestAsset') {
        const types = { svg: 'image/svg+xml', png: 'image/png', css: 'text/css' };
        fetch((window.__base ?? document.getElementById('app').dataset.base) + m.path)
          .then((r) => (r.ok ? r.arrayBuffer() : null))
          .then((b) => window.__send({ type: 'asset', id: m.id, mime: types[m.path.split('.').pop()] ?? '', data: b && btoa(String.fromCharCode(...new Uint8Array(b))) }));
      }
    },
    getState: () => window.__state,
    setState: (s) => { window.__state = s; },
  });
  window.__send = (m) => {
    if (m.type === 'init') window.__base = m.base; // assets come from the explainer shown
    // As VS Code's host does: from the parent (here the page itself), on the page's origin.
    window.dispatchEvent(new MessageEvent('message', { data: m, source: window.parent, origin: window.origin }));
  };
</script>
</head>
<body>
<div id="app" data-dir="file:///ws/.explain/bit-reader"></div>
<script nonce="harness">document.getElementById('app').dataset.base = `${location.origin}/fixtures/sample-workspace/.explain/bit-reader/`;</script>
<script type="module" nonce="harness" src="/dist/webview/main.js"></script>
</body>
</html>
